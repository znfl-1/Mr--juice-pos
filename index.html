<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mr Juice">
<meta name="theme-color" content="#3a2fd1">
<meta name="color-scheme" content="only light">
<title>Mr Juice POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: iPad landscape. Catalog (category tiles, then products) beside a receipt-style cart; fixed bottom nav like a till. Admin view adds KPIs, a 7-day chart and lists. */
:root {
--bg: #e6e9ef;
--surface: #ffffff;
--surface2: #eff2f7;
--tile: #dfe3ea;
--ink: #161c26;
--muted: #586272;
--line: #cfd6e0;
color-scheme: light;
--accent: #3a2fd1;
--accent-ink: #ffffff;
--good: #12803f;
--bad: #c2410c;
--font-display: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
--font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 100px; direction: rtl; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.wrap { max-width: 1320px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
.status { font-size: .8rem; color: var(--muted); }
/* bottom nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.nav button { flex: 1 1 0; max-width: 220px; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-weight: 500; font-size: .95rem; }
.nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-pressed="true"] { color: var(--accent); background: var(--surface2); }
.nav .cartbtn { display: none; color: var(--accent-ink); background: var(--accent); }
.nav .cartbtn b { font-family: var(--font-display); font-weight: 600; }
/* cashier */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
.catalog { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.search { width: 100%; min-height: 52px; padding-inline: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.crumb { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.crumb h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.back { min-height: 48px; padding-inline: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { position: relative; min-height: 156px; padding: 14px 10px 18px; border-radius: 12px; background: var(--tile); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; font-weight: 600; overflow: hidden; }
.tile::after { content: ""; position: absolute; inset-inline: 10px; bottom: 0; height: 5px; border-radius: 3px 3px 0 0; background: var(--accent); }
.tile svg { width: 52px; height: 52px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tile small { color: var(--muted); font-weight: 400; font-size: .8rem; }
.tile:active { transform: scale(.97); }
.prod { align-items: stretch; justify-content: space-between; text-align: start; min-height: 112px; }
.prod .pn { line-height: 1.35; }
.prod .pp { color: var(--accent); font-weight: 600; font-size: .95rem; }
.prod .q { position: absolute; top: 8px; inset-inline-start: 8px; min-width: 28px; height: 28px; padding-inline: 8px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: .85rem; display: grid; place-items: center; }
.receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 6px 6px 0 0; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
.receipt::after { content: ""; position: absolute; inset-inline: -1px; bottom: -9px; height: 9px; background: linear-gradient(135deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 9px repeat-x, linear-gradient(225deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 9px repeat-x; }
.receipt h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.receipt h2 small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: .8rem; }
.lines { display: flex; flex-direction: column; border-block: 1px dashed var(--line); max-height: 40vh; overflow-y: auto; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding-block: 8px; }
.line + .line { border-top: 1px dotted var(--line); }
.line .ln { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.line .ls { font-size: .85rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; }
.step { width: 44px; height: 44px; border-radius: 10px; background: var(--surface2); font-size: 1.3rem; font-weight: 600; }
.stepper .n { min-width: 28px; text-align: center; font-weight: 600; }
.lt { font-weight: 600; min-width: 56px; text-align: end; }
.empty { padding: 22px 8px; text-align: center; color: var(--muted); }
.total { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 600; color: var(--muted); font-size: .95rem; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field label { color: var(--muted); font-size: .9rem; }
.in { min-height: 48px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; min-width: 0; }
.field .in { width: 140px; text-align: end; }
.change { display: flex; justify-content: space-between; font-weight: 600; }
.btn { min-height: 56px; padding-inline: 20px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1.05rem; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--surface2); color: var(--ink); min-height: 48px; font-size: 1rem; }
.btn.sm { min-height: 46px; font-size: .95rem; padding-inline: 14px; }
/* size sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 20, .55); display: grid; place-items: center; padding: 16px; }
.scrim[hidden] { display: none; }
.sheet { width: min(420px, 100%); background: var(--surface); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.sizes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.sizes button { min-height: 92px; border-radius: 12px; background: var(--tile); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; }
.sizes button span { color: var(--accent); font-size: 1.2rem; }
/* lists + admin */
.page { display: flex; flex-direction: column; gap: 16px; }
.bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.bar h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 44px; padding-inline: 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .kl { color: var(--muted); font-size: .9rem; }
.kpi .kv { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .ks { font-size: .8rem; color: var(--muted); }
.kpi.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpi.main .kl, .kpi.main .ks { color: var(--bg); opacity: .75; }
.pos-v { color: var(--good); } .neg-v { color: var(--bad); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 small { color: var(--muted); font-weight: 400; font-size: .8rem; }
.legend { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.chartbox { overflow-x: auto; direction: ltr; }
.chartbox svg { width: 100%; min-width: 440px; height: auto; display: block; }
.rows { display: flex; flex-direction: column; }
.rows.scroll { max-height: 440px; overflow-y: auto; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 8px; min-height: 52px; }
.row + .row { border-top: 1px solid var(--line); }
.row .t { min-width: 0; overflow-wrap: anywhere; }
.row .t small { display: block; color: var(--muted); font-size: .82rem; }
.row .a { font-weight: 600; }
.del { min-height: 44px; min-width: 44px; padding-inline: 12px; border-radius: 10px; color: var(--bad); border: 1px solid var(--line); font-size: .9rem; font-weight: 500; }
.del.armed { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.top5 .row { grid-template-columns: minmax(0, 1fr) auto; }
.meter { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
.meter b { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.form { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; }
.form.p { grid-template-columns: 1.4fr 1fr 100px 100px auto; }
.note { color: var(--muted); font-size: .85rem; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; padding: 14px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; text-align: center; z-index: 40; }
.toast[hidden] { display: none; }
body:not(.authed) #app, body:not(.authed) .nav, body:not(.authed) .scrim { display: none; }
body.authed #login { display: none; }
.login { min-height: 80vh; display: grid; place-items: center; }
.login form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.login h1 { margin: 0; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; }
.login p { margin: 0; color: var(--muted); }
.login .msg { color: var(--bad); min-height: 1.5em; font-size: .95rem; }
body:not(.is-admin) #nav-admin { display: none; }
.linkbtn { color: var(--accent); font-weight: 600; min-height: 44px; }
/* delivery customer picker */
.cust { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: var(--surface2); }
.custsel { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.custform { display: flex; flex-direction: column; gap: 8px; }
.custlist { display: flex; flex-direction: column; gap: 4px; }
.custitem { min-height: 46px; padding-inline: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: start; font-weight: 500; }
.row a { color: var(--accent); }
/* notes, order states */
.notebtn { display: block; margin-top: 4px; min-height: 36px; padding: 2px 10px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: .85rem; text-align: start; }
.notebtn.has { border-style: solid; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.sheet .chips { max-height: 220px; overflow-y: auto; }
.nav button { position: relative; }
.badge { position: absolute; top: 4px; inset-inline-start: calc(50% + 6px); min-width: 22px; height: 22px; padding-inline: 6px; border-radius: 11px; background: var(--bad); color: #fff; font-size: .78rem; display: grid; place-items: center; }
.pill { display: inline-block; padding: 0 10px; border-radius: 10px; font-size: .78rem; font-weight: 600; background: var(--surface2); color: var(--muted); vertical-align: 1px; }
.pill.st-active { background: #fff1d6; color: #8a5a00; }
.pill.st-completed { background: #dff3e6; color: var(--good); }
.pill.st-refunded, .pill.st-cancelled { background: #fde4dc; color: var(--bad); }
.oi { font-weight: 500; }
.onote { color: var(--accent); font-weight: 600; }
.ord .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.ord .acts:empty { display: none; }
@media (max-width: 900px) {
.pos { grid-template-columns: minmax(0, 1fr); }
.receipt { position: relative; top: 0; }
.lines { max-height: none; }
.nav .cartbtn.on { display: flex; }
.form, .form.p { grid-template-columns: 1fr 1fr; }
.form .btn, .form.p .btn { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .tile, .btn { transition: transform .08s, background .15s; } }
</style>
</head>
<body>
<div class="login" id="login">
<form id="login-form" autocomplete="on">
<h1>Mr Juice</h1>
<p id="login-sub">سجّل الدخول لفتح الكاشير</p>
<input class="in" id="l-email" type="email" inputmode="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
<input class="in" id="l-pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" minlength="6" required>
<div class="msg" id="login-msg" role="alert"></div>
<button class="btn" id="login-go" type="submit">دخول</button>
<button class="linkbtn" id="login-toggle" type="button">إنشاء حساب جديد</button>
<p class="note">الموظف الجديد: اطلب من الأدمن إضافة بريدك أولًا، ثم أنشئ حسابك من هنا.</p>
</form>
</div>
<div class="wrap" id="app" dir="rtl" lang="ar">
<header class="top">
<div class="brand"><h1>Mr Juice</h1><span class="status" id="status">جاري التحميل…</span></div>
<button class="back" id="logout">خروج</button>
</header>
<main id="view-pos" class="pos">
<section class="catalog">
<input class="search" id="q" type="search" placeholder="بحث في المنتجات" autocomplete="off">
<div class="crumb" id="crumb"></div>
<div class="tiles" id="tiles"></div>
</section>
<aside class="receipt" id="cart-panel" aria-label="الطلب">
<h2>الطلب الحالي <small id="cart-count"></small></h2>
<div class="seg" id="otype">
<button data-t="dine" aria-pressed="true">صالة</button>
<button data-t="take" aria-pressed="false">تيك أواي</button>
<button data-t="delivery" aria-pressed="false">دليفري</button>
</div>
<div class="cust" id="cust" hidden></div>
<div class="lines" id="lines"></div>
<div class="total"><span>الإجمالي</span><span class="num" id="total">0 ج.م</span></div>
<div class="seg" id="method">
<button data-m="cash" aria-pressed="true">كاش</button>
<button data-m="card" aria-pressed="false">فيزا</button>
</div>
<div class="field" id="paid-row"><label for="paid">المبلغ المدفوع</label><input class="in num" id="paid" inputmode="decimal" placeholder="0" autocomplete="off"></div>
<div class="change" id="change" hidden><span id="change-l">الباقي للعميل</span><span class="num" id="change-v"></span></div>
<button class="btn" id="checkout" disabled>تأكيد ودفع</button>
<button class="btn ghost" id="kitchen" disabled>إرسال للمطبخ (الدفع لاحقًا)</button>
<button class="btn ghost" id="clear">مسح الطلب</button>
</aside>
</main>
<main id="view-orders" class="page" hidden></main>
<main id="view-customers" class="page" hidden></main>
<main id="view-admin" class="page" hidden></main>
</div>
<nav class="nav" aria-label="التنقل">
<button id="nav-pos" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
<button id="nav-orders" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>الطلبات<b class="badge num" id="ob" hidden></b></button>
<button id="nav-customers" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.7 3.2 2.5 3.5 5.2"/></svg>العملاء</button>
<button id="nav-admin" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>لوحة الأدمن</button>
<button class="cartbtn" id="nav-cart"><svg viewBox="0 0 24 24"><path d="M6 6h15l-2 9H8zM6 6L5 3H2M9 20h.01M18 20h.01"/></svg><b class="num" id="nav-total">0 ج.م</b></button>
</nav>
<div class="scrim" id="scrim" hidden>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
<h3 id="sheet-t"></h3>
<div class="sizes" id="sizes"></div>
<button class="btn ghost" id="sheet-x">إلغاء</button>
</div>
</div>
<div class="scrim" id="notescrim" hidden>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="note-t">
<h3 id="note-t"></h3>
<div class="chips" id="note-chips"></div>
<input class="in" id="note-in" placeholder="اكتب ملاحظة للمطبخ…" autocomplete="off">
<div class="seg"><button class="btn" id="note-ok">حفظ</button><button class="btn ghost" id="note-x">إلغاء</button></div>
</div>
</div>
<div class="scrim" id="payscrim" hidden>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pay-t">
<h3 id="pay-t"></h3>
<div class="total"><span>الإجمالي</span><span class="num" id="pay-total"></span></div>
<div class="seg" id="pay-method"><button data-pm="cash" aria-pressed="true">كاش</button><button data-pm="card" aria-pressed="false">فيزا</button></div>
<div class="field" id="pay-paid-row"><label for="pay-paid">المبلغ المدفوع</label><input class="in num" id="pay-paid" inputmode="decimal" placeholder="0" autocomplete="off"></div>
<div class="change" id="pay-change" hidden><span id="pay-change-l"></span><span class="num" id="pay-change-v"></span></div>
<button class="btn" id="pay-ok">تأكيد الدفع</button>
<button class="btn ghost" id="pay-x">إلغاء</button>
</div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="app.js?v=5"></script>
</body>
</html>
